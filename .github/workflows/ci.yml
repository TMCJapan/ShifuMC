name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tools:
    name: 生成器の単体テストとシェルの構文
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Paper のクローンは要らない。規則の読み取りと差し込みの判定だけを見る。
      - run: sh tools/test-all.sh

  bootstrap:
    name: 起動側のビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # shifu-bootstrap は Paper にも Minecraft にも依存しないので、単体で組める。
      - run: ./gradlew --no-daemon :shifu-bootstrap:jar

      - uses: actions/upload-artifact@v4
        with:
          name: shifu-launcher
          path: shifu-bootstrap/build/libs/shifu-*.jar
