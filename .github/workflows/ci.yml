name: CI

on:
  push:
    # 普段の作業は ver/* の上で進むので、そこでも走らせる。
    # main だけにしていたころは、1.18.2 のテストが陳腐化しても気付けなかった。
    branches: [main, master, "ver/**"]
  pull_request:

jobs:
  tools:
    name: 生成器の単体テストとシェルの構文
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Paper のクローンは要らない。規則の読み取りと差し込みの判定だけを見る。
      - run: sh tools/test-all.sh

      # *.ps1 は sh -n では見られないので PowerShell の parser に掛ける。
      # closure.ps1 / run-server.ps1 は classic の 3 系統(1.18.2 / 1.19.4 / 1.20.6)にしか無い。
      - name: PowerShell の構文
        shell: pwsh
        run: |
          $bad = 0
          foreach ($file in Get-ChildItem tools -Filter *.ps1) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  $bad = 1
                  $file.Name
                  $errors | ForEach-Object { "  " + $_.ToString() }
              }
          }
          exit $bad

  bootstrap:
    name: 起動側のビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # shifu-bootstrap は Paper にも Minecraft にも依存しないので、単体で組める。
      - run: ./gradlew --no-daemon :shifu-bootstrap:jar

      - uses: actions/upload-artifact@v4
        with:
          name: shifu-launcher
          path: shifu-bootstrap/build/libs/shifu-*.jar
